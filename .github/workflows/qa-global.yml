name: QA Global

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      include_stress:
        description: "Incluir testes de load/stress ARGOS"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: qa-global-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Lint · Unit · Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: meccafit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meccafit_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/meccafit_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Fast battery
        run: npm run test:global:fast

  integration:
    name: E2E · ARGOS · Stress
    runs-on: ubuntu-latest
    needs: fast
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Materialize .env.local
        id: env_local
        shell: bash
        env:
          SECRET_ENV_LOCAL_B64: ${{ secrets.ENV_LOCAL_B64 }}
          SECRET_ENV_LOCAL: ${{ secrets.ENV_LOCAL }}
          SECRET_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SECRET_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SECRET_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SECRET_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SECRET_FORGE_KEY: ${{ secrets.FORGE_KEY }}
        run: |
          set -euo pipefail

          write_individual() {
            local url anon pub svc forge
            url="${SECRET_NEXT_PUBLIC_SUPABASE_URL:-}"
            [ -z "$url" ] && url="${SECRET_SUPABASE_URL:-}"
            anon="${SECRET_NEXT_PUBLIC_SUPABASE_ANON_KEY:-}"
            [ -z "$anon" ] && anon="${SECRET_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}"
            [ -z "$anon" ] && anon="${SECRET_SUPABASE_ANON_KEY:-}"
            pub="${SECRET_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}"
            svc="${SECRET_SUPABASE_SERVICE_ROLE_KEY:-}"
            forge="${SECRET_FORGE_KEY:-}"

            if [ -z "$url" ] || [ -z "$anon" ]; then
              return 1
            fi

            {
              echo "NEXT_PUBLIC_SUPABASE_URL=$url"
              echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon"
              [ -n "$pub" ] && echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$pub"
              [ -n "$svc" ] && echo "SUPABASE_SERVICE_ROLE_KEY=$svc"
              [ -n "$forge" ] && echo "FORGE_KEY=$forge"
            } > .env.local
            return 0
          }

          if [ -n "${SECRET_ENV_LOCAL_B64:-}" ]; then
            printf '%s' "$SECRET_ENV_LOCAL_B64" | base64 -d > .env.local
          elif [ -n "${SECRET_ENV_LOCAL:-}" ]; then
            printf '%s\n' "$SECRET_ENV_LOCAL" > .env.local
          elif write_individual; then
            true
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Secrets Supabase ausentes — pulando E2E/ARGOS."
            exit 0
          fi

          node scripts/ci/validate-env-local.mjs
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Apply pending migrations (remote)
        if: steps.env_local.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "${SUPABASE_DB_PASSWORD}" ] || [ -n "${SUPABASE_ACCESS_TOKEN}" ]; then
            node scripts/apply-pending-migrations.mjs
          else
            echo "Auto-apply ignorado: configure SUPABASE_DB_PASSWORD ou SUPABASE_ACCESS_TOKEN."
          fi

      - name: Integration battery (E2E + ARGOS)
        if: steps.env_local.outputs.ready == 'true'
        env:
          CI: "true"
        run: |
          if [ "${{ github.event.inputs.include_stress || 'false' }}" = "true" ]; then
            node scripts/test/run-global-suite.mjs --integration-only --include-stress
          else
            node scripts/test/run-global-suite.mjs --integration-only
          fi

      - name: Upload Playwright report
        if: always() && steps.env_local.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage
        if: always() && steps.env_local.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
