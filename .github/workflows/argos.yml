name: ARGOS Security

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: argos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  argos:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize .env.local for ARGOS
        shell: bash
        env:
          SECRET_ENV_LOCAL_B64: ${{ secrets.ENV_LOCAL_B64 }}
          SECRET_ENV_LOCAL: ${{ secrets.ENV_LOCAL }}
          SECRET_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SECRET_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SECRET_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SECRET_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SECRET_FORGE_KEY: ${{ secrets.FORGE_KEY }}
        run: |
          set -euo pipefail

          write_individual() {
            local url anon pub svc forge
            url="${SECRET_NEXT_PUBLIC_SUPABASE_URL:-}"
            [ -z "$url" ] && url="${SECRET_SUPABASE_URL:-}"
            anon="${SECRET_NEXT_PUBLIC_SUPABASE_ANON_KEY:-}"
            [ -z "$anon" ] && anon="${SECRET_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}"
            [ -z "$anon" ] && anon="${SECRET_SUPABASE_ANON_KEY:-}"
            pub="${SECRET_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}"
            svc="${SECRET_SUPABASE_SERVICE_ROLE_KEY:-}"
            forge="${SECRET_FORGE_KEY:-}"

            if [ -z "$url" ] || [ -z "$anon" ]; then
              return 1
            fi

            {
              echo "NEXT_PUBLIC_SUPABASE_URL=$url"
              echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon"
              [ -n "$pub" ] && echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$pub"
              [ -n "$svc" ] && echo "SUPABASE_SERVICE_ROLE_KEY=$svc"
              [ -n "$forge" ] && echo "FORGE_KEY=$forge"
            } > .env.local
            echo "Fonte: secrets individuais"
            return 0
          }

          if [ -n "${SECRET_ENV_LOCAL_B64:-}" ]; then
            printf '%s' "$SECRET_ENV_LOCAL_B64" | base64 -d > .env.local
            echo "Fonte: ENV_LOCAL_B64 (base64)"
          elif [ -n "${SECRET_ENV_LOCAL:-}" ]; then
            printf '%s\n' "$SECRET_ENV_LOCAL" > .env.local
            echo "Fonte: ENV_LOCAL (multiline)"
          elif write_individual; then
            true
          else
            echo "Nenhum secret Actions encontrado."
            echo "Repository secrets: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, FORGE_KEY"
            echo "Ou ENV_LOCAL_B64 (base64 do .env.local)"
            exit 1
          fi

          node scripts/ci/validate-env-local.mjs

      - name: Build Next.js (UI route probes)
        run: npm run build

      - name: Start app for UI route probes
        run: |
          npm run start > /tmp/meccafit-app.log 2>&1 &
          echo $! > /tmp/meccafit-app.pid
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null; then
              echo "App ready on :3000"
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start — log:"
          tail -n 80 /tmp/meccafit-app.log || true
          exit 1

      - name: Apply pending migrations (remote)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "${SUPABASE_DB_PASSWORD}" ] || [ -n "${SUPABASE_ACCESS_TOKEN}" ]; then
            node scripts/apply-pending-migrations.mjs
          else
            echo "Auto-apply ignorado: configure SUPABASE_DB_PASSWORD ou SUPABASE_ACCESS_TOKEN nos secrets do repositorio."
            echo "Ou aplique manualmente: supabase/migrations/20260704120000_fix_mural_comunidade_anon_revoke.sql"
          fi

      - name: Ensure ARGOS test users and planilhas seed
        run: npm run seed:test-users

      - name: Run ARGOS test suite
        run: npm run argos:test

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/meccafit-app.pid ]; then
            kill "$(cat /tmp/meccafit-app.pid)" 2>/dev/null || true
          fi
