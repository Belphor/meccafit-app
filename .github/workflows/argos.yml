name: ARGOS Security

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: argos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  argos:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize .env.local for ARGOS
        shell: bash
        run: |
          set -euo pipefail

          write_individual() {
            local url anon pub svc forge
            url="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
            [ -z "$url" ] && url="${{ secrets.SUPABASE_URL }}"
            anon="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
            [ -z "$anon" ] && anon="${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"
            [ -z "$anon" ] && anon="${{ secrets.SUPABASE_ANON_KEY }}"
            pub="${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"
            svc="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            forge="${{ secrets.FORGE_KEY }}"

            if [ -z "$url" ] || [ -z "$anon" ]; then
              return 1
            fi

            {
              echo "NEXT_PUBLIC_SUPABASE_URL=$url"
              echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon"
              [ -n "$pub" ] && echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$pub"
              [ -n "$svc" ] && echo "SUPABASE_SERVICE_ROLE_KEY=$svc"
              [ -n "$forge" ] && echo "FORGE_KEY=$forge"
            } > .env.local
            echo "Fonte: secrets individuais"
            return 0
          }

          if [ -n "${{ secrets.ENV_LOCAL_B64 }}" ]; then
            echo "${{ secrets.ENV_LOCAL_B64 }}" | base64 -d > .env.local
            echo "Fonte: ENV_LOCAL_B64 (base64)"
          elif [ -n "${{ secrets.ENV_LOCAL }}" ]; then
            printf '%s\n' "${{ secrets.ENV_LOCAL }}" > .env.local
            echo "Fonte: ENV_LOCAL (multiline)"
          elif write_individual; then
            true
          else
            echo "Nenhum secret Actions encontrado."
            echo "Crie ENV_LOCAL (conteúdo do .env.local) OU secrets individuais."
            echo "Settings → Secrets and variables → Actions → Repository secrets"
            exit 1
          fi

          node scripts/ci/validate-env-local.mjs

      - name: Build Next.js (UI route probes)
        run: npm run build

      - name: Start app for UI route probes
        run: |
          npm run start > /tmp/meccafit-app.log 2>&1 &
          echo $! > /tmp/meccafit-app.pid
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null; then
              echo "App ready on :3000"
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start — log:"
          tail -n 80 /tmp/meccafit-app.log || true
          exit 1

      - name: Run ARGOS test suite
        run: npm run argos:test

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/meccafit-app.pid ]; then
            kill "$(cat /tmp/meccafit-app.pid)" 2>/dev/null || true
          fi
