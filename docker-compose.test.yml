services:
  meccafit-test-postgres:
    image: postgres:17-alpine
    container_name: meccafit-test-postgres
    environment:
      POSTGRES_DB: meccafit_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meccafit_test"]
      interval: 2s
      timeout: 3s
      retries: 30
