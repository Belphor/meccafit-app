# Meccafit — ambiente Docker
#
# Desenvolvimento (hot reload):
#   docker compose --profile dev up --build
#
# Produção local:
#   docker compose --profile prod up --build -d
#
# Postgres isolado para testes backend:
#   docker compose --profile test up -d
#   npm run test:backend
#
# Bateria global (lint, unit, backend, E2E, ARGOS):
#   docker compose --profile qa up --build --abort-on-container-exit --exit-code-from test-runner
#
# Bateria global + stress/load:
#   docker compose --profile qa run --rm test-runner npm run test:global:stress

x-qa-env: &qa-env
  NODE_ENV: test
  DOCKER_TEST: "1"
  CI: "true"
  TEST_DATABASE_URL: postgresql://postgres:postgres@postgres-test:5432/meccafit_test
  TEST_DB_ALLOWED_HOSTS: postgres-test
  ARGOS_APP_URL: http://app-qa:3000
  PLAYWRIGHT_BASE_URL: http://app-qa:3000
  PLAYWRIGHT_SKIP_WEBSERVER: "1"
  ARGOS_SKIP_APP_BOOT: "1"

services:
  app-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: meccafit-app-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next_cache:/app/.next
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    restart: unless-stopped

  app:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_CARDIO_TEST_MODE: ${NEXT_PUBLIC_CARDIO_TEST_MODE:-0}
    container_name: meccafit-app
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
    restart: unless-stopped

  postgres-test:
    profiles: ["test", "qa"]
    image: postgres:17-alpine
    container_name: meccafit-test-postgres
    environment:
      POSTGRES_DB: meccafit_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meccafit_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - meccafit-qa

  app-qa:
    profiles: ["qa"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: meccafit-app-qa
    command: ["node", "scripts/test/start-qa-app.mjs", "foreground"]
    env_file:
      - path: .env.local
        required: true
    environment:
      NODE_ENV: production
      ARGOS_APP_URL: http://app-qa:3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok||r.status===307||r.status===308?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 120s
    networks:
      - meccafit-qa

  test-runner:
    profiles: ["qa"]
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: meccafit-test-runner
    depends_on:
      postgres-test:
        condition: service_healthy
      app-qa:
        condition: service_healthy
    env_file:
      - path: .env.local
        required: true
      - path: .env.test
        required: false
    environment:
      <<: *qa-env
    volumes:
      - ./coverage:/app/coverage
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report
    networks:
      - meccafit-qa

volumes:
  app_node_modules:
  app_next_cache:

networks:
  meccafit-qa:
    driver: bridge
